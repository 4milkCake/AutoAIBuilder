name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Restore, build and test
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.423"

      - name: Restore locked dependencies
        run: dotnet restore AutoAIBuilder.sln --locked-mode

      - name: Build
        run: dotnet build AutoAIBuilder.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AutoAIBuilder.sln --configuration Release --no-build --no-restore
